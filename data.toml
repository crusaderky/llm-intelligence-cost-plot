RTX_3090_PC_192GB = 8478  # 24 GB VRAM + 192 GB host RAM
STRIX_HALO = 3099  # Bosgame, 128 GB unified
DGX_SPARK = 5999  # Asus Ascent GX10, 128 GB unified
GORGON_HALO = 6199  # Bosgame, 192 GB unified
QSFP112_CABLE = 108  # 400G direct attach for 2~4x DGX Spark
QSFP_DD_SWITCH = 1295  # 4-port 400G for 8x DGX Spark
QSFP_DD_BREAKOUT_CABLE = 90  # 400G to 2x200G

# Price per task is derived by Model.price_per_task(). Stored inputs:
# - intelligence + aa_cost_per_task + aa_sticker_price: artificialanalysis.ai (AA model
#   page flight payloads, sub-unit / sub-cent precision). aa_cost_per_task is AA's cost
#   of one task split by token type (a PricedTokens, whose three streams sum to the
#   total) and aa_sticker_price is those same three streams in USD per 1M tokens.
# - datacenter: or_slug + or_eff_input_price / or_eff_output_price (openrouter.ai, GET
#   /api/frontend/v1/stats/effective-pricing: each endpoint instance's mean effective
#   price over the trailing week, weighted by the share of the model's tokens that
#   instance served, $/M tokens).
# - local: local_speed, both rates on the RTX 3090 measurement rig. The prefill rate is
#   a guesstimate at 10x the decode rate until it gets measured.
# - hardware_bom: one-off price of the cheapest rig that can run the model, as a sympy
#   expression over HARDWARE_PRICES keys, e.g. "DGX_SPARK*3+QSFP112_CABLE*3" (see
#   README's "Larger local models" table). Tags the hardware-cost plot; None leaves the
#   model off it.
#
# See .agents/skills/refresh-models for how to re-fetch these numbers. A ladder of
# effort levels is one Model row (any one rung, tag and all) plus one ModelEffort per
# other rung; expand_model_efforts clones the base row into those rungs below.
