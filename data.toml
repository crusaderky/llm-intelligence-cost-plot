intelligence = 8.9
provider_type = "local"
aa_page_slug = "qwen3-6-35b-a3b"
aa_record_name = "Qwen3.6 35B A3B (Reasoning)"
aa_derived = false
aa_cost_per_task = [0.66, 0.13, 0.0]
aa_sticker_price = [0.375, 2.25, 0.0]
