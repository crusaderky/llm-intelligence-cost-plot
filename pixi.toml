[workspace]
authors = ["crusaderky <crusaderky@gmail.com>"]
channels = ["conda-forge"]
name = "llm-intelligence-cost-plot"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
plot = "python scripts/plot.py"
aa-query = "python scripts/aa_query.py"
refresh_models = "python scripts/refresh_models.py"
lint = "ruff check --fix && ruff format && mdformat README.md AGENTS.md"

[dependencies]
mdformat = "*"
matplotlib = "*"
pydantic = "*"
ruff = "*"
tomlkit = "*"
sympy = "*"
